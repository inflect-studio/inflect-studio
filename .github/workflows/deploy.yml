name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sshpass -p "$SFTP_PASSWORD" sftp             -o StrictHostKeyChecking=accept-new             -P "$SFTP_PORT"             "$SFTP_USER@$SFTP_HOST" <<'SFTP_EOF'
          cd inflect_studio
          put index.php
          put bio.php
          put kontakt.php
          put projekty.php
          mkdir projekty-demo\n          cd projekty-demo\n          put projekty-demo/index.php\n          cd ..
          put -r admin
          put -r assets
          bye
          SFTP_EOF
